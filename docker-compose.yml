name: calculator

services:
  calculator:
    image: ${IMAGE:-calculator-api:latest}
    build: .
    container_name: calculator-app
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8080"
    networks:
      - calc-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    build: ./nginx
    image: calculator-proxy:latest
    container_name: calculator-proxy
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    healthcheck:
      # goes through the proxy to the API, so it checks the whole chain
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  calc-net:
    driver: bridge
