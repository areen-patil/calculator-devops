services:
  calculator:
    image: ${IMAGE:-calculator-api:latest}
    build: .
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8080"
    networks:
      - calc-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
